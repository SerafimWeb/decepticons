<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Olho do Pai — o anúncio principal (laranja e ciano)</title>
<link rel="stylesheet" href="_comum.css">
<style>
  .painel { --luz: rgba(255, 140, 30, .13); --o: #ff9d1c; --a: #19e3ff; }
  .o { --c: var(--o); }
  .a { --c: var(--a); }
</style>
</head>
<body>
<div class="painel">
  <!-- O título, empilhado: a marca é o que o jogador lê primeiro. -->
  <div class="tubo o" style="top: 62px; font-size: 156px; letter-spacing: 8px"><span class="base">OLHO</span><span class="miolo">OLHO</span></div>
  <div class="t cor a" style="top: 226px; font-size: 92px; letter-spacing: 14px">DO</div>
  <div class="tubo o" style="top: 318px; font-size: 156px; letter-spacing: 8px"><span class="base">PAI</span><span class="miolo">PAI</span></div>

  <!-- A frase do produto. -->
  <div class="t cor o" style="top: 742px; font-size: 45px; letter-spacing: 2px">RASTREAMENTO</div>
  <div class="t cor a" style="top: 794px; font-size: 45px; letter-spacing: 6px">DE CELULAR</div>
  <div class="t neon o" style="top: 840px; font-size: 92px; letter-spacing: 4px">24H</div>

  <div class="url a" style="top: 936px"><span>odp.serafimweb.com</span></div>
</div>
<script src="_comum.js"></script>
<script>
  const O = '#ff9d1c';
  const A = '#19e3ff';
  marca.moldura({ c1: O, c2: A });
  const s = marca.camada();

  // O celular, em pé, com o radar e o alfinete na tela.
  const g = marca.el('g', { style: `filter: drop-shadow(0 0 8px ${O}) drop-shadow(0 0 22px ${O}88);` }, s);
  marca.el('rect', { x: 174, y: 470, width: 164, height: 262, rx: 28, fill: 'rgba(0,0,0,.6)', stroke: O, 'stroke-width': 4 }, g);
  marca.el('rect', { x: 184, y: 504, width: 144, height: 196, rx: 10, fill: 'rgba(8,34,52,.6)', stroke: A, 'stroke-width': 1.6, opacity: 0.9 }, g);
  marca.el('path', { d: 'M236,487 h40', stroke: O, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
  marca.el('path', { d: 'M226,718 h60', stroke: O, 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.8 }, g);
  const t = marca.el('g', { style: `filter: drop-shadow(0 0 6px ${A});` }, s);
  marca.radar(t, 256, 640, 62, A, { aneis: 3, elipse: 0.42 });
  marca.alfinete(s, 256, 618, 66, O);

  // O nó do olho (octógono) ligado ao celular, e o sinal do lado direito.
  const oct = (cx, cy, r) => Array.from({ length: 8 }, (_, i) => { const a = Math.PI / 8 + (i * Math.PI) / 4; return `${cx + Math.cos(a) * r},${cy + Math.sin(a) * r}`; }).join(' ');
  const n = marca.el('g', { style: `filter: drop-shadow(0 0 7px ${A});` }, s);
  marca.el('polygon', { points: oct(84, 604, 48), fill: 'rgba(0,0,0,.55)', stroke: A, 'stroke-width': 3.5 }, n);
  marca.el('polygon', { points: oct(84, 604, 38), fill: 'none', stroke: A, 'stroke-width': 1.2, opacity: 0.6 }, n);
  marca.olho(s, 84, 604, 22, O, '#7a4300');
  marca.el('path', { d: 'M132,604 H150 L160,594 H174', fill: 'none', stroke: O, 'stroke-width': 3.5, 'stroke-linejoin': 'round', style: `filter: drop-shadow(0 0 5px ${O});` }, s);
  marca.el('path', { d: 'M338,604 H356 L366,614 H380', fill: 'none', stroke: A, 'stroke-width': 3.5, 'stroke-linejoin': 'round', style: `filter: drop-shadow(0 0 5px ${A});` }, s);
  marca.sinal(s, 424, 626, 38, A, 5.5);

  // Detalhes discretos nas bordas.
  marca.dados(s, 44, 470, ['GPS · LOCK', 'SYNC · OK', 'ANDROID'], A);
  marca.dados(s, 468, 470, ['24H', 'ONLINE', 'SEGURO'], O, { ancora: 'end' });
  marca.sinal(s, 462, 70, 17, O, 3);
  marca.sinal(s, 52, 950, 17, O, 3);
</script>
</body>
</html>
