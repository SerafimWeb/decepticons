<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Olho do Pai — Ping em até 5 segundos (verde)</title>
<link rel="stylesheet" href="_comum.css">
<style>
  .painel { --luz: rgba(90, 210, 20, .20); --g: #a8ff1a; --g2: #e7ff7a; --y: #ffe14d; --c: var(--g); }
  .marca { position: absolute; left: 0; right: 0; top: 884px; text-align: center; font-size: 21px; letter-spacing: 6px; line-height: 1; color: #fff; text-shadow: 0 0 10px var(--g); }
</style>
</head>
<body>
<div class="painel">
  <div class="t neon" style="top: 470px; font-size: 176px; letter-spacing: 8px">PING</div>
  <div class="t neon" style="top: 636px; font-size: 150px; letter-spacing: 2px">&lt; 5s</div>
  <div class="t fina" style="top: 808px; font-size: 40px; letter-spacing: 1px; color: var(--y); text-shadow: 0 0 14px #ffb700, 0 0 30px #ffb70088">Localização na hora</div>
  <div class="t fina" style="top: 856px; font-size: 21px; letter-spacing: 1px; color: #d8f0b0; opacity: .9">Peça a posição agora, sem esperar o ciclo</div>
  <div class="marca" style="display: none"></div>
  <div class="url" style="top: 930px; --c: var(--g)"><span>odp.serafimweb.com</span></div>
</div>
<script src="_comum.js"></script>
<script>
  const G = '#a8ff1a';
  const Y = '#ffe14d';
  marca.moldura({ c1: G, c2: Y, grossura: 4 });
  const s = marca.camada();

  // Anéis de radar ao fundo, em volta do sinal.
  const fundo = marca.el('g', { opacity: 0.5 }, s);
  for (const r of [70, 120, 170, 222]) marca.el('circle', { cx: 256, cy: 340, r, fill: 'none', stroke: G, 'stroke-width': 1.3, opacity: 1 - r / 330 }, fundo);
  marca.el('path', { d: 'M256,100 V470 M60,340 H452', stroke: G, 'stroke-width': 1, opacity: 0.35 }, fundo);

  // O sinal grande: o ponto na base e os arcos subindo, como o "ping" do aplicativo.
  marca.sinal(s, 256, 392, 190, G, 21);
  // Os pings saindo do ponto.
  const ondas = marca.el('g', { fill: 'none', stroke: G, 'stroke-width': 2, opacity: 0.55 }, s);
  for (const r of [34, 56]) marca.el('circle', { cx: 256, cy: 392, r, 'stroke-dasharray': '4 7' }, ondas);

  // As barras amarelas de cima e de baixo (como no exemplo do Comandante).
  for (const y of [84, 942]) marca.el('rect', { x: 66, y, width: 380, height: 3, fill: Y, style: `filter: drop-shadow(0 0 7px ${Y});`, opacity: 0.85 }, s);
  marca.olho(s, 256, 112, 16, '#00d4ff');
  marca.dados(s, 44, 140, ['PING · REMOTO', 'GPS · LOCK'], G);
  marca.dados(s, 468, 140, ['1–2 S ABERTO', '< 5 S ONLINE'], G, { ancora: 'end' });
</script>
</body>
</html>
