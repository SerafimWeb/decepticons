name: CI

# [R15] Mesmo check do hook pre-push: typecheck + testes + roadmap + build + budget + boot headless + site.
# O runner traz o Google Chrome; o smoke usa ele via playwright-core. Imagem fixada de propósito:
# trocar de versão (ex.: ubuntu-26.04) é decisão nossa, não migração surpresa do ubuntu-latest.
#
# MINUTOS (13/10, Qwen a pedido do Comandante): o repositório é PRIVADO, então cada minuto de Actions é
# medido — o plano gratuito dá ~2.000 min/mês e a cota estourou (12/10). Duas travas para não estourar de novo:
#   1) PR/merge que só mexe em `*.md` NÃO roda a suíte pesada (o passo "Mudou só documentação?" decide pelo
#      diff). O job ainda termina VERDE, para o `npm run publicar` (que espera a linha `check`) continuar valendo.
#   2) `concurrency` cancela a execução anterior quando o mesmo PR recebe outro push (economiza as corridas
#      repetidas que os agentes fazem). O `deploy` mantém a trava própria (nunca cancela um deploy no meio).
#   3) (P223, 19/10) O push na `main` NÃO refaz o check quando a árvore é a mesma que o PR já provou verde
#      (`scripts/ciJaProvado.mjs`: junção, árvore idêntica, execução verde do PR; na dúvida roda tudo). Era 38% dos minutos.
#   4) PR em rascunho não roda (roda ao ficar pronto). O consumo se mede com `npm run ci:consumo`.
# Ver DEPLOY.md § "Minutos do CI".
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# As páginas do site leem a lista de PRs (equipe, entregas) com o token do próprio workflow.
permissions:
  contents: read
  pull-requests: read
  actions: read # os bastidores medem os deploys (métricas DORA) nas execuções do CI

jobs:
  check:
    # PR em rascunho não gasta minutos: o check roda quando ele fica pronto (ready_for_review).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # os bastidores medem a evolução em cada merge da main; o diff de docs precisa dos dois commits
      # Decide se o diff é só `*.md`. Na dúvida (base ilegível, diff vazio ou erro) o padrão é RODAR a suíte:
      # um portão a mais nunca é pior que um portão furado.
      - name: Mudou só documentação?
        id: docs
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then base='${{ github.event.before }}'; fi
          quais=$(git diff --name-only "$base...${{ github.sha }}" 2>/dev/null || echo ERRO)
          if [ -z "$base" ] || [ "$quais" = "ERRO" ] || [ -z "$quais" ] || echo "$quais" | grep -qvE '\.md$'; then
            echo "so_docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "so_docs=true" >> "$GITHUB_OUTPUT"
            echo "Só documentação (*.md): a suíte pesada não se aplica."
          fi
      # Push na main: esta árvore exata já passou no check do PR? Então não repete (o job termina verde em segundos).
      - name: Esta árvore já passou no PR?
        id: provada
        if: github.event_name == 'push' && steps.docs.outputs.so_docs != 'true'
        run: node scripts/ciJaProvado.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v7
        if: steps.docs.outputs.so_docs != 'true' && steps.provada.outputs.ja_provada != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.docs.outputs.so_docs != 'true' && steps.provada.outputs.ja_provada != 'true'
      - run: npm run check
        if: steps.docs.outputs.so_docs != 'true' && steps.provada.outputs.ja_provada != 'true'
        env:
          GH_TOKEN: ${{ github.token }}

  # "Build do dia": cada merge na main com check verde vai para o site (DEPLOY.md).
  # Dormente até existir a variável de repositório SITE_URL e os secrets DEPLOY_*.
  # DESLIGADO por padrão (P221, 19/10): o site vai ao ar pelo PC do dono (`npm run publicar-site`, DEPLOY.md), de graça e já provado, e o secret DEPLOY_PATH do GitHub não bate com a trava
  # abaixo (o job falhava vermelho). Só roda se existir a variável de repositório DEPLOY_PELO_ACTIONS = true; antes disso, confira os secrets DEPLOY_* (DEPLOY.md).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SITE_URL != '' && vars.DEPLOY_PELO_ACTIONS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # os bastidores medem a evolução em cada merge da main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --capturas: entra no jogo headless e fotografa para a landing (~30 s; falha não derruba o site).
      - run: npm run site -- --capturas
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Servidor público do multiplayer (endereço, não é segredo): liga o "Jogar online" do jogo e da landing.
          VITE_GAME_SERVER: ${{ vars.GAME_SERVER_URL }}

      # Mesmo padrão do deploy do CAPTIA nesta conta Hostinger: rsync + SSH (porta 65002), com
      # novas tentativas (a proteção anti-abuso da Hostinger às vezes derruba a conexão).
      # tr -d '\r' limpa CRLF do Windows na chave.
      - name: Publicar via rsync
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # O --delete apaga no servidor o que não existe aqui: com o caminho errado apagaria o site
          # real da Selva MKT (selvamkt.com.br). Só publica na raiz do cybermech.online: .../domains/cybermech.online/public_html/.
          case "$DEPLOY_PATH" in
            */domains/cybermech.online/public_html/) ;;
            *) echo "::error::DEPLOY_PATH precisa terminar em /domains/cybermech.online/public_html/"; exit 1 ;;
          esac
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > deploy_key
          chmod 600 deploy_key
          SSH="ssh -p 65002 -i deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15"
          ok=
          for attempt in 1 2 3 4 5; do
            if rsync -az --delete --chmod=D755,F644 -e "$SSH" .tmp/site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"; then
              ok=1; break
            fi
            echo "rsync: tentativa $attempt falhou; nova tentativa em $((attempt*30)) s"
            sleep $((attempt*30))
          done
          rm -f deploy_key
          [ -n "$ok" ] || { echo "::error::rsync falhou depois de 5 tentativas"; exit 1; }

      - name: Conferir o site publicado
        run: node scripts/site.mjs --verify "${{ vars.SITE_URL }}"
