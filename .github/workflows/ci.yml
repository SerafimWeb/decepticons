name: CI

# [R15] Mesmo check do hook pre-push: typecheck + testes + build + budget + boot headless.
# O runner traz o Google Chrome; o smoke usa ele via playwright-core. Imagem fixada de propósito:
# trocar de versão (ex.: ubuntu-26.04) é decisão nossa, não migração surpresa do ubuntu-latest.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
